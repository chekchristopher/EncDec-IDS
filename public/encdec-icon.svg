<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 2D Dark Premium Canvas -->
  <rect width="512" height="512" rx="128" fill="#030712"/>

  <!-- 2D Trust Shield Group -->
  <g transform="translate(0, 0)">
    
    <!-- LEFT FACET: Electric Cyan 2D Shield Wing -->
    <path d="M 252 80
             C 188 80 120 106 108 164
             C 108 284 186 384 252 432
             L 252 80 Z"
          fill="#06b6d4" />

    <!-- RIGHT FACET: Deep Trust Blue / Emerald 2D Shield Wing -->
    <path d="M 260 80
             C 324 80 392 106 404 164
             C 404 284 326 384 260 432
             L 260 80 Z"
          fill="#0ea5e9" />

    <!-- 2D INTRIGUING TRUST CHECK EMBLEM (Negative Space / Pure White) -->
    <path d="M 196 252 
             L 238 294 
             L 322 206" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

  </g>
</svg>

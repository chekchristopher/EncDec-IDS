<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b192e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="keyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Tech Border Grid -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  
  <!-- Corner Tech Accents -->
  <path d="M 64 120 L 64 64 L 120 64" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 448 120 L 448 64 L 392 64" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 64 392 L 64 448 L 120 448" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 448 392 L 448 448 L 392 448" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Cyber Circuit Lines -->
  <g opacity="0.4" stroke="#0284c7" stroke-width="2" fill="none">
    <path d="M 120 180 L 180 180 L 220 220"/>
    <circle cx="120" cy="180" r="4" fill="#06b6d4"/>
    <path d="M 392 180 L 332 180 L 292 220"/>
    <circle cx="392" cy="180" r="4" fill="#06b6d4"/>
    <path d="M 140 340 L 200 340 L 230 310"/>
    <circle cx="140" cy="340" r="4" fill="#10b981"/>
    <path d="M 372 340 L 312 340 L 282 310"/>
    <circle cx="372" cy="340" r="4" fill="#10b981"/>
  </g>

  <!-- Outer Cyber Shield Contour with Glow -->
  <path d="M 256 70 
           C 340 70 410 100 410 170 
           C 410 300 320 390 256 430 
           C 192 390 102 300 102 170 
           C 102 100 172 70 256 70 Z" 
        fill="#071326" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Shield Cryptographic Lattice -->
  <path d="M 256 96 
           C 324 96 380 120 380 178 
           C 380 286 308 360 256 396 
           C 204 360 132 286 132 178 
           C 132 120 188 96 256 96 Z" 
        fill="#040c1a" 
        stroke="#0284c7" 
        stroke-width="3" 
        stroke-opacity="0.6"/>

  <!-- Encryption / Decryption Symmetric Key Nodes & Matrix -->
  <!-- Left Wing: Encrypt Ring (0110) -->
  <g transform="translate(190, 220)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="18" fill="#032b44" stroke="#22d3ee" stroke-width="3"/>
    <!-- Lock Shackle -->
    <path d="M -8 -4 L -8 -12 C -8 -18 8 -18 8 -12 L 8 -4" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Wing: Decrypt Key Ring -->
  <g transform="translate(322, 220)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="18" fill="#043224" stroke="#34d399" stroke-width="3"/>
    <!-- Unlocked / Key Glyph -->
    <path d="M -6 -4 L -6 -12 C -6 -18 8 -18 8 -12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central Fusion Core: Neural IDS Defense Diamond -->
  <g transform="translate(256, 220)" filter="url(#subtleGlow)">
    <!-- Central Diamond Node -->
    <polygon points="0,-48 42,0 0,48 -42,0" fill="url(#coreGlow)" opacity="0.95"/>
    <polygon points="0,-36 30,0 0,36 -30,0" fill="#051329"/>
    
    <!-- IDS Pulse Wave Center -->
    <circle cx="0" cy="0" r="12" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Dual Synaptic Data Bridges (Enc <-> Dec) -->
  <path d="M 190 220 L 214 220" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 298 220 L 322 220" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <!-- Upper Quantum Radar Beam -->
  <path d="M 256 125 L 256 172" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Lower IDS Baseline Defense Arc -->
  <path d="M 200 310 Q 256 345 312 310" fill="none" stroke="url(#coreGlow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Central "ENC • DEC" Binary Typography -->
  <text x="256" y="375" 
        font-family="system-ui, -apple-system, monospace" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#38bdf8" 
        text-anchor="middle" 
        opacity="0.95">ENC • DEC</text>

  <!-- Sub-label IDS -->
  <text x="256" y="398" 
        font-family="system-ui, -apple-system, monospace" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#10b981" 
        text-anchor="middle" 
        opacity="0.85">HYBRID IDS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#030712"/>

  <!-- 2D Trust Shield -->
  <g transform="translate(0, 0)">
    <!-- Left Facet (Cyan) -->
    <path d="M 63 20
             C 47 20 30 26 27 41
             C 27 71 46 96 63 108
             L 63 20 Z"
          fill="#06b6d4" />

    <!-- Right Facet (Trust Blue) -->
    <path d="M 65 20
             C 81 20 98 26 101 41
             C 101 71 82 96 65 108
             L 65 20 Z"
          fill="#0ea5e9" />

    <!-- 2D Trust Check -->
    <path d="M 49 63 L 60 74 L 81 52" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
